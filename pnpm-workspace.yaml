packages: [packages/*, server, web, site]
# Versions that must move together across projects (`catalog:` in their package.json). Not every shared
# dependency is listed yet: extending the catalog is a refactoring candidate (notes file).
catalog:
  typescript: ~7.0.2
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.1
  tailwindcss: ^4.3.5
  "@tailwindcss/vite": ^4.3.5
  vite: ^8.3.8
  zod: ^4.6.7
  shiki: ^4.6.0
  "@types/node": ^26.6.6
  # The runtime dependencies of the published package (scripts/package.test.ts): exact versions, since an install
  # from the tarball has no lockfile. Server API, and its RPC types in web (N7); v5 is a refactoring candidate.
  hono: 4.13.18
  # Left out of the server bundle (vite.config.ts): dependencies of the root package, which runs dist/, and of server.
  "@hono/node-server": 2.1.7
  ws: 8.22.2
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.7"
  - "@biomejs/cli-android-arm64@2.6.7"
  - "@biomejs/cli-android-x64@2.6.7"
  - "@biomejs/cli-darwin-arm64@2.6.7"
  - "@biomejs/cli-darwin-x64@2.6.7"
  - "@biomejs/cli-linux-arm64-musl@2.6.7"
  - "@biomejs/cli-linux-arm64@2.6.7"
  - "@biomejs/cli-linux-x64-musl@2.6.7"
  - "@biomejs/cli-linux-x64@2.6.7"
  - "@biomejs/cli-win32-arm64@2.6.7"
  - "@biomejs/cli-win32-x64@2.6.7"
  - lucide-react@1.72.0
  - hono@4.13.18
  - "@hono/node-server@2.1.7"
