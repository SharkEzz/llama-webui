packages: [packages/*, app, site]
# Versions that must move together across projects (`catalog:` in their package.json). Not every shared
# dependency is listed yet: extending the catalog is a refactoring candidate (notes file).
catalog:
  typescript: ~7.0.2
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.3
  tailwindcss: ^4.3.5
  tw-animate-css: ^1.4.0
  "@tailwindcss/vite": ^4.3.5
  vite: ^8.4.0
  shiki: ^4.6.0
  "@types/node": ^26.6.11
  "@types/react": ^19.3.3
  "@types/react-dom": ^19.3.0
  # The profiling tool (root scripts/profiling) and the site's screenshots drive the same Chromium
  puppeteer-core: ^25.19.0
  # Effect: same version as the vendored reference (repos/effect), every @effect/* package moves with it
  effect: 4.1.6
  "@effect/platform-node": 4.1.6
  "@effect/sql-sqlite-node": 4.1.6
  "@effect/vitest": 4.1.6
  "@effect/tsgo": 0.73.7
  "oxlint-plugin-react-doctor": ^0.9.23
  "oxlint-tailwindcss": ^1.17.2
  rolldown: ^1.3.4

minimumReleaseAge: 60
strictPeerDependencies: true
dedupePeers: true
