packages: [packages/*, app, site]
# Versions that must move together across projects (`catalog:` in their package.json): every dependency that more
# than one package of the workspace names is listed here.
catalog:
  typescript: ~7.0.2
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.3
  tailwindcss: ^4.3.5
  tw-animate-css: ^1.4.0
  "@tailwindcss/vite": ^4.3.5
  vite: ^8.4.0
  shiki: ^4.6.0
  "@types/node": ^26.6.11
  "@types/react": ^19.3.3
  "@types/react-dom": ^19.3.0
  # The profiling tool (root scripts/profiling) and the site's screenshots drive the same Chromium
  puppeteer-core: ^25.19.0
  # Effect: one exact version, every @effect/* package moves with it
  effect: 4.1.7
  "@effect/platform-node": 4.1.7
  "@effect/sql-sqlite-node": 4.1.7
  "@effect/vitest": 4.1.7
  "@effect/tsgo": 0.74.0
  "oxlint-plugin-react-doctor": ^0.9.23
  "oxlint-tailwindcss": ^1.17.2
  rolldown: ^1.3.4
  lucide-react: ^1.82.0
  # The app and the site: the shadcn components and what they build on, the fonts, React Router's Node runtime
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@react-router/node": ^8.5.3
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.5.2
  remark-gfm: ^4.0.1
  shadcn: ^4.23.1

minimumReleaseAge: 60
strictPeerDependencies: true
dedupePeers: true
