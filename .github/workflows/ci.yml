# Quality gate for the whole repo (app + website): Biome, type check, tests, website build.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history: the executable's version comes from `git describe`
      # pnpm installs (version from `packageManager`), Bun runs the scripts.
      - uses: pnpm/action-setup@v6
      # The React Router CLI (site build) and the llamacpp-js tests run on Node too.
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13
          cache: pnpm
      # Same version as the `bun` peer of bun-plugin-tailwind in pnpm-lock.yaml, which scripts run first.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun test
      # llamacpp-js targets Node >= 24 too: its tests (node:test) run again under Node, on the TypeScript sources.
      - run: bun run --cwd packages/llamacpp-js test:node
      # Standalone executable: builds, starts, serves the production UI.
      - run: bun run compile
      - run: bun scripts/smoke-binary.ts dist/llama-webui
      - run: bun run site:build
      - run: bun run --cwd site check-links

  # llamacpp-js still supports Node >= 24, while the workspace needs Node 26: its tests (no dependencies) run on the
  # lowest supported version too.
  llamacpp-js-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test 'tests/*.test.ts'
        working-directory: packages/llamacpp-js
