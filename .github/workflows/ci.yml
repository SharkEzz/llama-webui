# Quality gate for the whole repo (app + website): Biome, type check, tests, website build.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history: the build's version comes from `git describe`
      # pnpm installs (version from `packageManager`) and runs the gate, on Node.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13
          cache: pnpm
      # The website's scripts still run with Bun (until N10).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      # Vitest, then llamacpp-js (node --test).
      - run: pnpm test
      # Production build: starts from an empty data directory, serves the production UI and the WebSocket.
      - run: pnpm build
      - run: node scripts/smoke.ts
      - run: bun run site:build
      - run: bun run --cwd site check-links

  # llamacpp-js still supports Node >= 24, while the workspace needs Node 26: its tests (no dependencies) run on the
  # lowest supported version too.
  llamacpp-js-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Otherwise setup-node reads `packageManager` and looks for pnpm, which this job does not install.
          package-manager-cache: false
      - run: node --test 'tests/*.test.ts'
        working-directory: packages/llamacpp-js
