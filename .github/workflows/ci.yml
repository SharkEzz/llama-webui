# Quality gate for the whole repo (app + website): Biome, type check, tests, website build.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history: the executable's version comes from `git describe`
      # pnpm installs (version from `packageManager`) and runs the gate; the app, its build and the Bun replay of the
      # server tests still need Bun until the runtime flip.
      - uses: pnpm/action-setup@v6
      # Vitest, tsc, the llamacpp-js tests and the React Router CLI (site build) run on Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13
          cache: pnpm
      # Same version as the `bun` peer of bun-plugin-tailwind in pnpm-lock.yaml, which scripts run first.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      # Vitest (Node), llamacpp-js (node --test), then the server tests again under Bun (`test:bun`).
      - run: pnpm test
      # Standalone executable: builds, starts, serves the production UI.
      - run: bun run compile
      - run: bun scripts/smoke-binary.ts dist/llama-webui
      - run: bun run site:build
      - run: bun run --cwd site check-links

  # llamacpp-js still supports Node >= 24, while the workspace needs Node 26: its tests (no dependencies) run on the
  # lowest supported version too.
  llamacpp-js-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Otherwise setup-node reads `packageManager` and looks for pnpm, which this job does not install.
          package-manager-cache: false
      - run: node --test 'tests/*.test.ts'
        working-directory: packages/llamacpp-js
