# The npm package of the app (`pnpm pack` of the root package: `npm install -g ./llama-webui-<version>.tgz` gives the
# `llama-webui` command) attached to a GitHub Release, for every `v*` tag: the build reports the tag as its version
# (`git describe`). The tag must match the version of every package.json (`pnpm release <version>`, merged before
# tagging). The quality gate already ran on master (ci.yml); the tarball is installed and smoke-tested before
# publishing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history, for `git describe`
      - uses: pnpm/action-setup@v6
      # No `cache: pnpm` here: the published package is built from a fresh install, not from a restored store.
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.ts --check "$GITHUB_REF_NAME"
      - run: pnpm build
      - run: pnpm pack --pack-destination release
      # Installed with npm into an empty prefix, then started through its bin (scripts/smoke.ts).
      - run: node scripts/smoke.ts --tarball release/llama-webui-*.tgz
      - run: cd release && sha256sum llama-webui-*.tgz > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
