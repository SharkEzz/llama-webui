# The workspace on Node 26 with its dependencies, for the CI jobs (after actions/checkout).
name: Setup
description: pnpm (version from `packageManager`), Node 26.13 with the pnpm store cached, then `pnpm install --frozen-lockfile`.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26.13
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
